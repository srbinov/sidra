<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading</title>
<link rel="stylesheet" href="windowChrome.css">
<style>
html, body {
  background: #000000;
}
.icon {
  width: 120px;
  height: 120px;
  margin-bottom: 18px;
}
.wordmark {
  color: #ffffff;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.021em;
  margin-bottom: 32px;
}
.spinner {
  width: 20px;
  height: 20px;
  border: 2px solid rgba(252, 60, 68, 0.18);
  border-top-color: #fc3c44;
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
  margin-bottom: 14px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.loading-text {
  color: #a1a1a6;
  font-size: 12px;
  letter-spacing: 0.02em;
}
@media (prefers-reduced-motion: reduce) {
  .spinner {
    animation: none;
    border-color: #fc3c44;
    border-top-color: transparent;
  }
}
</style>
</head>
<body>
<img class="icon" src="music_icon_DEFAULTMODE.svg" alt="" width="120" height="120">
<div class="wordmark">Apple Music</div>
<div class="spinner" aria-hidden="true"></div>
<span class="loading-text">Loading...</span>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var text = params.get('text') || 'Loading...';
  var lang = params.get('lang') || '';
  document.title = text;
  document.querySelector('.loading-text').textContent = text;
  if (lang === 'ar' || lang === 'he') {
    document.dir = 'rtl';
  }
})();
</script>
</body>
</html>
